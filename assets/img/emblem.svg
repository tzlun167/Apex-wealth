<?xml version="1.0" encoding="UTF-8"?>
<!--
  鼎富家族辦公室 Apex Wealth Family Office — 家族徽章（置中堆疊版）
  The Heritage Shield — stacked lockup

  構圖：加冕獅子（守護）× 四分盾（傳承）＋ 中央 AW 花押 × 緞帶
  四象徵：古樹（基業長青）· 典籍（知識傳承）· 無限（永續）· 山峰（巔峰）
  用途：登入頁、封面、印刷品等需要完整品牌識別的場合
  搭配：導覽列請用 emblem-horizontal.svg；純圖記請用 emblem-mark.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560"
     role="img" aria-label="鼎富家族辦公室 Apex Wealth Family Office 家族徽章">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"   stop-color="#EBD285"/>
      <stop offset="40%"  stop-color="#D4AF37"/>
      <stop offset="75%"  stop-color="#B8952C"/>
      <stop offset="100%" stop-color="#96771F"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F2E0A0"/>
      <stop offset="100%" stop-color="#C9A430"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EBD285"/>
      <stop offset="52%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8852A"/>
    </linearGradient>
  </defs>

  <!-- ══════════ 加冕獅子（heraldic lion）══════════ -->
  <g transform="translate(186,96)">
    <g fill="url(#g1)">
      <!-- 尾巴：自臀後向上捲，末端帶穗 -->
      <path d="M-44,-14 C-60,-16 -68,-32 -62,-46 C-58,-56 -47,-57 -42,-50"
            fill="none" stroke="url(#g1)" stroke-width="4.8" stroke-linecap="round"/>
      <circle cx="-43" cy="-53" r="6"/>

      <!-- 後腿（遠） -->
      <path d="M-40,-6 L-44,20 L-33,20 L-31,-5 Z"/>
      <!-- 前腿（遠） -->
      <path d="M14,8 L13,30 L24,30 L23,8 Z"/>

      <!-- 身軀 + 頸 + 頭：一體成形，頭部抬起 -->
      <path d="M-44,-12
               C-42,-24 -31,-30 -16,-30
               C-3,-30 7,-32 15,-38
               C21,-43 29,-47 38,-45
               C49,-43 56,-34 54,-25
               C52,-16 44,-11 36,-13
               C30,-15 25,-13 21,-8
               C15,-3 6,0 -4,0
               C-21,0 -38,-4 -44,-12 Z"/>

      <!-- 後腿（近，帶腳掌） -->
      <path d="M-32,-4 L-36,22 L-24,22 L-22,-3 Z"/>
      <rect x="-38" y="18" width="15" height="5" rx="2.5"/>
      <!-- 前腿（近，帶腳掌） -->
      <path d="M1,2 L-1,26 L11,26 L12,2 Z"/>
      <rect x="-3" y="23" width="16" height="5" rx="2.5"/>

      <!-- 鬃毛：頭部外環 + 放射尖刺 -->
      <circle cx="40" cy="-32" r="15"/>
      <path d="M28,-42 L22,-50 M36,-46 L34,-55 M45,-47 L47,-57 M53,-43 L58,-51
               M58,-34 L66,-36 M57,-26 L64,-22 M50,-20 L54,-13 M40,-19 L41,-11"
            stroke="url(#g1)" stroke-width="3.6" stroke-linecap="round"/>

      <!-- 耳 -->
      <path d="M38,-45 L41,-55 L48,-47 Z"/>
      <!-- 眼 / 鼻 / 口 -->
      <circle cx="48" cy="-32" r="2.2" fill="#121212"/>
      <circle cx="56" cy="-22" r="2.6" fill="#121212"/>
      <path d="M56,-18 L56,-14" stroke="#121212" stroke-width="1.7" stroke-linecap="round"/>

      <!-- 王冠 -->
      <path d="M28,-54 L33,-66 L40,-57 L47,-70 L54,-57 L61,-66 L66,-54 Z"/>
      <rect x="27" y="-57" width="40" height="8" rx="3"/>
      <circle cx="33" cy="-67" r="3"/>
      <circle cx="47" cy="-71" r="3.4"/>
      <circle cx="61" cy="-67" r="3"/>
    </g>
  </g>

  <!-- ══════════ 盾牌外框 ══════════ -->
  <path d="M96,132
           L96,286
           C96,368 144,420 200,450
           C256,420 304,368 304,286
           L304,132
           C304,123 295,118 287,122
           L264,135
           C238,125 214,121 200,121
           C186,121 162,125 136,135
           L113,122
           C105,118 96,123 96,132 Z"
        fill="url(#g1)"/>
  <!-- 盾內深色底 -->
  <path d="M110,143
           L110,286
           C110,360 152,408 200,434
           C248,408 290,360 290,286
           L290,143
           C290,141 288,140 286,141
           L264,153
           C238,143 214,139 200,139
           C186,139 162,143 136,153
           L114,141
           C112,140 110,141 110,143 Z"
        fill="#121212" opacity="0.94"/>
  <!-- 盾內金框 -->
  <path d="M118,151 L118,286 C118,354 156,400 200,424
           C244,400 282,354 282,286 L282,151"
        fill="none" stroke="url(#g2)" stroke-width="1.8" opacity="0.9"/>

  <!-- ══════════ 兩側掛枝（laurel sprigs，自盾緣斜向揚起）══════════ -->
  <g fill="url(#g1)">
    <!-- 左：三片尖葉，由下往上、葉尖朝外上 -->
    <path d="M100,320 C80,306 58,300 44,306 C52,318 76,330 100,330 Z"/>
    <path d="M100,262 C78,246 55,240 41,247 C50,260 76,272 100,273 Z"/>
    <path d="M100,204 C80,190 59,185 46,191 C54,203 78,214 100,215 Z"/>
    <!-- 右：鏡射 -->
    <path d="M300,320 C320,306 342,300 356,306 C348,318 324,330 300,330 Z"/>
    <path d="M300,262 C322,246 345,240 359,247 C350,260 324,272 300,273 Z"/>
    <path d="M300,204 C320,190 341,185 354,191 C346,203 322,214 300,215 Z"/>
  </g>
  <g fill="none" stroke="#8A6E1F" stroke-width="1.1" opacity="0.4">
    <path d="M100,324 C80,314 60,308 48,308"/>
    <path d="M100,266 C78,256 58,250 45,249"/>
    <path d="M100,208 C80,198 61,193 50,192"/>
    <path d="M300,324 C320,314 340,308 352,308"/>
    <path d="M300,266 C322,256 342,250 355,249"/>
    <path d="M300,208 C320,198 339,193 350,192"/>
  </g>

  <!-- ══════════ 十字分隔 ══════════ -->
  <g stroke="url(#g2)" stroke-width="1.6" opacity="0.75">
    <line x1="200" y1="147" x2="200" y2="418"/>
    <line x1="122" y1="268" x2="278" y2="268"/>
  </g>
  <path d="M200,262 L206,268 L200,274 L194,268 Z" fill="url(#g2)"/>

  <!-- ══════════ 四象限象徵 ══════════ -->
  <g fill="url(#g1)">
    <!-- 左上：古樹 -->
    <g transform="translate(161,204)">
      <path d="M-3.4,-4 L-3.4,26 C-3.4,29.4 3.4,29.4 3.4,26 L3.4,-4 Z"/>
      <circle cx="0"   cy="-16" r="14"/>
      <circle cx="-12" cy="-4"  r="9.5"/>
      <circle cx="12"  cy="-4"  r="9.5"/>
      <circle cx="-6"  cy="-27" r="8.5"/>
      <circle cx="7"   cy="-27" r="8.5"/>
      <path d="M-2,28 C-7,32 -13,34 -18,35 M2,28 C7,32 13,34 18,35"
            fill="none" stroke="url(#g1)" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- 右上：典籍 -->
    <g transform="translate(239,202)">
      <path d="M-21,-18 C-13,-21 -5,-21 0,-17 C5,-21 13,-21 21,-18
               L21,15 C13,12 5,12 0,16 C-5,12 -13,12 -21,15 Z"/>
      <path d="M0,-17 L0,16" fill="none" stroke="#121212" stroke-width="1.8" opacity="0.8"/>
      <path d="M-17,-11 L-5,-13 M-17,-5 L-5,-7 M-17,1 L-5,-1
               M5,-13 L17,-11 M5,-7 L17,-5 M5,-1 L17,1"
            fill="none" stroke="#121212" stroke-width="1.3" opacity="0.45"/>
      <path d="M-21,15 L-25,20 L25,20 L21,15 Z"/>
    </g>

    <!-- 左下：無限 -->
    <g transform="translate(161,329)">
      <path d="M0,0 C-6,-14 -17,-20 -26,-19 C-37,-18 -42,-9 -42,0
               C-42,9 -37,18 -26,19 C-17,20 -6,14 0,0
               C6,-14 17,-20 26,-19 C37,-18 42,-9 42,0
               C42,9 37,18 26,19 C17,20 6,14 0,0 Z"
            fill="none" stroke="url(#g1)" stroke-width="6.4" stroke-linecap="round"/>
    </g>

    <!-- 右下：山峰 -->
    <g transform="translate(240,332)">
      <path d="M-35,19 L-12,-19 L0,2 L16,-26 L37,19 Z"/>
      <path d="M16,-26 L10,-16 L16,-18 L21,-13 L24,-6 L16,-10 L9,-4 L11,4
               L16,-1 L22,2"
            fill="none" stroke="#121212" stroke-width="1.9" opacity="0.75"
            stroke-linejoin="round"/>
      <path d="M-35,19 L37,19" stroke="#121212" stroke-width="1.7" opacity="0.65"/>
    </g>
  </g>

  <!-- ══════════ 中央 AW 花押 ══════════ -->
  <g transform="translate(200,268)">
    <circle cx="0" cy="0" r="34" fill="#121212"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#g2)" stroke-width="2"/>
    <circle cx="0" cy="0" r="28.5" fill="none" stroke="url(#g1)" stroke-width="0.9" opacity="0.55"/>
    <g fill="none" stroke="url(#g1)" stroke-width="4.4"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M-19,-14 L-13,14 L-6.5,-4 L0,14 L6.5,-4 L13,14 L19,-14"/>
      <path d="M-10,7 L0,-18 L10,7"/>
      <path d="M-5.5,-3 L5.5,3"/>
    </g>
  </g>

  <!-- ══════════ 緞帶 ══════════ -->
  <g>
    <path d="M52,438 L348,438 L348,516
             C310,502 258,495 200,495 C142,495 90,502 52,516 Z"
          fill="url(#gr)"/>
    <path d="M52,438 L348,438" stroke="#8A6E1F" stroke-width="1.6" opacity="0.75"/>
    <path d="M52,438 L24,456 L24,516 L52,516 Z" fill="#A8852A"/>
    <path d="M52,438 L24,456 L52,470 Z" fill="#876A1D" opacity="0.5"/>
    <path d="M348,438 L376,456 L376,516 L348,516 Z" fill="#A8852A"/>
    <path d="M348,438 L376,456 L348,470 Z" fill="#876A1D" opacity="0.5"/>

    <text x="200" y="459"
          font-family="'EB Garamond', Garamond, Georgia, serif"
          font-size="13.5" letter-spacing="4.6" fill="#5A4712"
          text-anchor="middle">FAMILY OFFICE</text>
    <line x1="118" y1="467" x2="282" y2="467" stroke="#8A6E1F" stroke-width="0.9" opacity="0.5"/>
    <text x="200" y="491"
          font-family="'EB Garamond', Garamond, Georgia, serif"
          font-size="29" letter-spacing="0.6" fill="#4A390C"
          text-anchor="middle">Apex Wealth</text>
  </g>
</svg>
